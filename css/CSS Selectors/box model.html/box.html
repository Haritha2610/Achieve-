<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box model</title>
    <link rel="stylesheet" href="box style.css">
</head>
<body>
    
    <div class="card">
        <div class="header">
            <h1>
                IDENTIFICATION CARD
            </h1>
        </div>
        <div class="content">
            <div class="left">
                <img src="/Html/images/hari.jpg" alt="*****">
            </div>
            <div class="right">
                <div class="details">
                    <div class="row">
                        <span class="label">Name:</span>
                        <span class="value">Alice</span>
                    </div>
                    <div class="row">
                        <span class="label">Title:</span>
                        <span class="value">Director</span>
                    </div>
                    <div class="row">
                        <span class="label">ID No:</span>
                        <span class="value">1047921</span>
                    </div>
                    <div class="row">
                        <span class="label">ISSUSED:</span>
                        <span class="value">01/01/2025</span>
                    </div>
                    <div class="row">
                        <span class="label">Expires:</span>
                        <span class="value">31/12/2027</span>
                    </div>
                    <div class="company">
                        Acheivers IT
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
